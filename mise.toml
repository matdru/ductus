[tools]
tuist = "4.210.0"
swiftlint = "0.65.1"

[tasks.generate]
description = "Generate the Xcode workspace"
run = "tuist generate --no-open"

[tasks.test]
description = "Run all unit tests on the iPad simulator"
run = "tuist test --no-selective-testing --skip-ui-tests --device 'iPad Pro 13-inch (M5)' --os 27.0"

[tasks.lint]
description = "SwiftLint + swift-format lint"
run = [
  "swiftlint --strict",
  "xcrun swift-format lint --strict --recursive Apps Modules Project.swift Tuist.swift",
]

[tasks.format]
description = "Format all Swift sources in place"
run = "xcrun swift-format format --in-place --recursive Apps Modules Project.swift Tuist.swift"

[tasks.device]
description = "Build, sign, install and launch an app on a connected iPad (needs DUCTUS_TEAM, DUCTUS_DEVICE in mise.local.toml)"
usage = 'arg "[app]" default="FeelLab" help="FeelLab, Ductus or Prototype"'
run = """
set -euo pipefail
: "${DUCTUS_TEAM:?set DUCTUS_TEAM in mise.local.toml}"
: "${DUCTUS_DEVICE:?set DUCTUS_DEVICE (UDID from 'xcrun devicectl list devices') in mise.local.toml}"
app="${usage_app}"
# `tuist test` regenerates without schemes for apps that have no tests, so regenerate first.
tuist generate --no-open > /dev/null
xcodebuild -workspace Ductus.xcworkspace -scheme "$app" -configuration Debug \
  -destination "platform=iOS,id=$DUCTUS_DEVICE" -derivedDataPath .build/device \
  -allowProvisioningUpdates DEVELOPMENT_TEAM="$DUCTUS_TEAM" CODE_SIGN_STYLE=Automatic \
  build -quiet
bundle=".build/device/Build/Products/Debug-iphoneos/$app.app"
xcrun devicectl device install app --device "$DUCTUS_DEVICE" "$bundle"
xcrun devicectl device process launch --device "$DUCTUS_DEVICE" \
  "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$bundle/Info.plist")"
"""

[tasks.pull-logs]
description = "Copy Ductus touch recordings (DevLogs) from the connected iPad to .build/devlogs"
run = """
set -euo pipefail
: "${DUCTUS_DEVICE:?set DUCTUS_DEVICE in mise.local.toml}"
mkdir -p .build/devlogs
files=$(xcrun devicectl device info files --device "$DUCTUS_DEVICE" --domain-type appDataContainer \
  --domain-identifier app.ductus --subdirectory Documents/DevLogs 2>/dev/null | grep -oE '^touches-[^ ]+[.]jsonl' || true)
[ -n "$files" ] || { echo "No recordings on the iPad yet (tap REC in the editor's status bar)."; exit 0; }
for f in $files; do
  [ -f ".build/devlogs/$f" ] || xcrun devicectl device copy from --device "$DUCTUS_DEVICE" --domain-type appDataContainer \
    --domain-identifier app.ductus --source "Documents/DevLogs/$f" --destination ".build/devlogs/$f" > /dev/null
done
ls -1t .build/devlogs | head -5
"""

[tasks.ui-shots]
description = "Tap through the app on the simulator (UI tests) and save screenshots to .build/ui-shots"
run = """
#!/usr/bin/env zsh
set -e
rm -rf .build/ui-shots && mkdir -p .build/ui-shots
tuist generate --no-open > /dev/null
TEST_RUNNER_SHOTS_DIR="$PWD/.build/ui-shots" xcodebuild test -workspace Ductus.xcworkspace -scheme Ductus-Workspace \
  -destination 'platform=iOS Simulator,name=iPad Pro 13-inch (M5),OS=27.0' \
  -only-testing:DuctusUITests -collect-test-diagnostics never 2>&1 | grep -E "error:|failed|passed|Test Suite|XCTAssert|TEST (SUCCEEDED|FAILED)" || true
ls .build/ui-shots
"""
